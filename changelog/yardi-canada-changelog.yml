summary: >-
  There is no API changelog, no release-notes feed and no dated version history for
  any Yardi interface. What exists — and what is recorded here because it is genuinely
  dated, product-specific and published on the Canadian property — is a seasonal
  "What's new in Yardi Breeze Premier" post series on www.yardibreeze.ca, plus Yardi's
  press-release stream for platform-level announcements. The Breeze posts describe
  real feature-level changes (permissions, notifications, workflow behaviour), so they
  function as informal release notes for the product a Yardi Canada Breeze client
  actually runs. Formal, versioned change communication for the gated interfaces lives
  behind Client Central.
