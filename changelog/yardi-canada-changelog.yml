entries:
  - date: '2026-06-08'
    product: Yardi Breeze Premier (Canada)
    title: 'What''s new in Yardi Breeze Premier: Summer 2026'
    url: https://www.yardibreeze.ca/blog/2026/06/whats-new-yardi-breeze-premier-summer-2026/
    breaking: false
    additions:
      - Opt-in email on every triggered system notification (payment failures, services enabled).
      - Maintenance request auto-notifications for requests created in the platform or mobile app.
      - Email history report extended to include maintenance request emails (full communication audit trail).
      - Vendor categories — custom groupings assignable to vendors for filtering in maintenance, payments and vendor lists.
      - New permission controlling which users can view vendor financial details in the vendor ledger.
      - Smart AP (AI invoice processing) can be triggered from inside the platform; PDF upload auto-codes fields in about five minutes.
      - Hold checkbox on Vendor and Owner profiles, and at individual payable level, to pause payments with permission controls.
      - New dashboard widgets, including Publish to RentCafe status and recurring payments.
  - date: '2025-08-11'
    product: Yardi Breeze Premier (Canada)
    title: 'Client feedback, our update: What''s new in Breeze Premier'
    url: https://www.yardibreeze.ca/blog/2025/08/whats-new-in-breeze-premier/
    breaking: false
    additions:
      - Recurring journal entries can be deleted when no longer needed.
      - Payables import using EFT payment methods.
      - Inactive bank accounts hidden by default, with filters to show them.
      - Tenant statement correspondence reports can be scheduled and emailed automatically.
      - Remittance advice reports include a payment date column.
      - Configurable handling of rejected invoices (leave in place, or return to workflow).
      - Larger note fields and resizable attached PDFs on invoice screens.
      - Move-out dates shown directly in the tenant list view.
