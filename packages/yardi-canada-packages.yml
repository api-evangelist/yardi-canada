summary: >-
  Yardi ships no client libraries. npm, PyPI, NuGet, RubyGems, Packagist, crates.io and
  pkg.go.dev were searched for first-party Yardi, Voyager, RentCafe and Virtuoso
  packages and nothing official was found — which is the expected result for a vendor
  whose interfaces are only reachable after a signed Data Exchange Agreement. The two
  results worth recording are a near-miss and a false positive, both noted below so a
  later round does not re-litigate them.
