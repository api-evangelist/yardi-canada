aid: yardi-canada
name: Yardi Canada
review:
  question: Does Yardi Canada publish a public, machine-readable API surface — and what
    is its RESO posture and access gate?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: property-management
  specsHarvested: 0
  openapiDirectoryCreated: false

sectorPosture:
  resoPosture:
    summary: No RESO reference found — Yardi does not appear anywhere in the RESO
      certification directory, and RESO certification in Canada sits with the real
      estate boards, not with property management vendors.
    certified: false
    webApiCertification: none
    dataDictionaryCertification: none
    dataDictionaryVersion: null
    resoDirectoryEvidence: |
      The full RESO certification directory at https://www.reso.org/certificates/ was
      fetched on 2026-07-26 (HTTP 200, 416,233 bytes) and searched case-insensitively.
      There are ZERO occurrences of "Yardi", zero of "Point2", and zero of "RentCafe"
      in the document. Yardi Canada Ltd., Yardi Systems, Inc., and their Canadian
      subsidiaries hold no RESO Web API certification and no RESO Data Dictionary
      certification of any version.

      The same fetched document does contain Canadian entries, which is the useful
      contrast — RESO certification in Canada exists, it just sits with boards and
      board technology co-operatives rather than with the property management vendor:
        - Information Technology Systems Ontario (ITSO) — UOI M00000807,
          2022-03-23, "Passed Current",
          https://certification.reso.org/summary/M00000807
        - Vancouver Island Real Estate Board — UOI M00000576, 2025-03-09,
          "Passed Current", https://certification.reso.org/summary/M00000576
        - Victoria Real Estate Board — UOI M00000051, 2022-08-15, "Passed Current"
        - Toronto Regional Real Estate Board — UOI M00000527, 2025-03-09,
          "Uncertified", https://certification.reso.org/summary/M00000527
        - Greater Vancouver REALTORS® — UOI M00000671, 2024-02-12, "Uncertified",
          https://certification.reso.org/summary/M00000671
        - Kingston & Area Real Estate Association — UOI M00000410, 2025-03-10,
          "Uncertified"
      Recording Yardi as RESO-adjacent because it operates in the same market would
      have been a fabrication. It is not in the directory.
    odataEndpointProbed: true
    odataEndpointResult: |
      No OData surface of any kind. https://www.yardi.com/$metadata returned HTTP 404
      and https://www.yardibreeze.ca/$metadata returned HTTP 404. No /Reso path, no
      /odata path, no OData service document is served on any Yardi host that
      resolves. There is no $metadata contract to harvest.
    upi: |
      No RESO Universal Property Identifier (UPI) usage found. Yardi Voyager keys
      property, unit and lease records on internal Voyager identifiers, and its
      published interface material (Master Data, Commercial, ILS/Guest Card) refers to
      MITS and OSCRE lineage rather than to RESO's Data Dictionary or UPI. Canada's
      nearest counterparts to a canonical property identifier are provincial — Ontario
      PINs administered through the Teranet-operated land registry, and municipal
      assessment roll numbers — and none of them are exposed by Yardi.
    marketContext: |
      This is a property management vendor, not a listing syndicator, so the absence of
      RESO is doubly expected. Canadian residential listings do not move through ~500
      independent MLSs as they do in the United States; they move through a single
      national co-operative — the Canadian Real Estate Association's Data Distribution
      Facility (DDF), which syndicates member boards' listings and powers REALTOR.ca.
      RESO's mandate comes from NAR, an American industry body with no authority north
      of the border, so what RESO certification exists in Canada is voluntary and
      board-level (ITSO, Vancouver Island REB, Victoria REB above). Land registration
      is provincial and largely privatised — Teranet operates Ontario's registry under
      long concession — which means the public record itself is a commercial product
      rather than an open dataset. Yardi Canada touches none of these seams: it is the
      operating ledger behind the landlord, not the listing rail or the registry.

  accessGate:
    classification: partner-only
    whatADeveloperMustSignOrJoin: |
      A developer cannot sign up. There is no key request form, no console, no trial,
      no sandbox that is not itself a partner benefit. To touch a Yardi interface a
      developer must be accepted into the Interface Partnership Program, documented at
      https://www.yardi.com/company/become-an-interface-partner/ (HTTP 200), which
      states a five-step path: submit an application, execute a Data Exchange Agreement
      with Yardi for each interface type, develop the interfacing application,
      beta-test with a pilot client, then release for general availability.

      The qualification bar is commercial, not technical:
        - Standard Interface (SIPP) partners: the company must be at least two years
          old and must already have three or more active Voyager clients, and must
          have programming capability in-house or a developer partner.
        - RentCafe API program: the applicant must already be working with clients
          who use RentCafe.
      Fees are explicit and recurring — "The annual fee varies per interface type and,
      in some cases, is based on a per-transactional model."

      For the RentCafe API a second, separate instrument governs use. The published
      RentCafe API Terms of Use at https://resources.yardi.com/legal/rc-api-tou/ (HTTP
      200) states that a licensee's "license of, access to and use of any of the
      features, products and services of the RentCafe application programming interface
      is by way of that certain RentCafe API Access Agreement between you and Yardi
      Systems, Inc." Use is confined to serving "Common Clients" — entities that are
      simultaneously clients of Yardi and of the integrating company — and the
      integrator "may not provide Common Client Data to any third parties, except as
      expressly permitted by the Common Client whose Common Client Data is involved."
      The API may not be used "to provide programming services or any other services
      for non-Common Clients."

      In short: you must already be a going concern with an installed base of Yardi
      customers before Yardi will contract with you, and the contract is per-interface
      and paid annually. That is a commercial partnership, not developer onboarding.
    gated: true
    gateNote: |
      The important distinction for this study is that this is a *commercial* gate in
      front of interfaces that genuinely exist and are named, not the "certified but
      unreachable" pattern (there is no certification) and not the "nothing published
      at all" pattern (the interface families and RentCafe operation names are
      published). The barrier is a signed Data Exchange Agreement plus an installed
      client base plus an annual fee — a partner deal.

  openData:
    hasOpenData: false
    note: |
      Yardi Canada publishes no open, unlicensed, publicly callable dataset. Its
      market-data products — Yardi Matrix and the Canadian rent and asset-management
      material promoted at https://info.yardi.com/asset-management-software-for-canada
      (HTTP 200) — are subscription research and lead-generation assets, not open data.
      No CSV, JSON, bulk download, feed or public API is offered.
    canadaOpenDataCounterweight: |
      Unlike the UK (HM Land Registry Price Paid, Ordnance Survey open products) and
      Australia, Canada has a weak open counterweight in this sector, and that is the
      structural point worth recording. Provincial land registration is largely
      privatised under long concessions — Teranet operates Ontario's — so the public
      record is itself sold as a commercial product. Listing data is held by a single
      national co-operative (CREA) and distributed through the DDF under member
      agreements. The genuinely open Canadian layer that does exist is statistical and
      federal (Statistics Canada, CMHC housing data), not transactional. None of it is
      published by Yardi, and Yardi is a consumer of the private layer rather than a
      publisher of anything open.

  authModel:
    scheme: opaque access token, issued under contract; no public scheme documented
    detail: |
      No authentication documentation is published, because no API reference is
      published. The only first-party statement of a credential model is in the
      RentCafe API Terms of Use, which refers to a per-company access token and its
      revocation: "The Company's access token will terminate and Company will no longer
      have access to the Data Exchange Program" on termination. No token format, no
      header name, no issuance endpoint, no refresh flow, no scope vocabulary, and no
      rate-limit policy is published anywhere public.

      Federated identity was probed anonymously and is not offered:
      https://www.yardi.com/.well-known/openid-configuration returned HTTP 404 and
      https://www.yardibreeze.ca/.well-known/openid-configuration returned HTTP 404. No
      OpenID Connect discovery document, no published OAuth2 authorization or token
      endpoint, no SAML metadata. Client-facing sign-in exists (Voyager, Breeze and
      RentCafe tenant/manager portals) but those are product logins reached through
      client-specific hostnames, not a developer identity surface.

  webhooksEventsSdksPostman:
    webhooks: none found
    events: none found
    sdks: none found
    cli: none found
    postman: none found
    note: |
      Absence is the finding, and the GitHub evidence makes it unusually clean. There
      is no "yardi" GitHub organisation (GET /orgs/yardi returned HTTP 404 via the
      GitHub API). The real organisation is https://github.com/YardiSystems (org id
      11193624, created 2015-02-25, 13 public repositories, 314 followers, blog
      https://www.yardi.com/). Every one of those 13 public repositories is an archived
      fork of unrelated third-party open source — ment.io, angular-mailcheck, rrule,
      quill, pdf.js-viewer, FileSaver.js, llm-retrieval-plugin,
      microsoft-teams-apps-callrecord-insights, websocketd, TESTING-jmeter,
      angularjs-xlsx-export, bolt.diy, FlowiseArchive — and the organisation itself
      carries archived_at 2025-09-15. There is no Yardi SDK, client library, CLI,
      Postman workspace or collection, webhook catalogue, or event stream in public.
      Yardi's interfaces are described as batch and web-service data exchange; nothing
      published describes an outbound event delivery mechanism to a partner endpoint.

  productApiFamily:
    note: |
      Yardi's own segmentation, taken faithfully from
      https://www.yardi.com/services/interfaces/standard-interface-options/ (HTTP 200),
      which describes 450+ standard interface partners, is functional rather than
      market-facing:
        - Collections API — MITS-based; resident/lease data export for collections.
        - Commercial API — commercial property, unit, lease and rent roll data;
          Yardi describes this interface as built on the OSCRE standard.
        - Construction API — contract/job information exchange, change orders.
        - Internet Listing Service (ILS) & Guest Card — MITS-compliant; unit
          availability, pricing, floor plans, and inbound lead generation.
        - Maintenance API — work order and service request bidirectional sync.
        - Master Data API — resident/tenant, unit, lease and property pulls/updates.
        - Payables API — vendor, payables, cheque and purchase order data.
        - Receivables API — MITS-based; resident balance, billing, payment processing.
        - Renters Insurance API — MITS-based; policy import/export.
        - Revenue API — unit pricing and lease rate optimisation.
        - Screening API — MITS-based; applicant screening and decision import.
        - Senior Living EHR/eMAR — electronic health records and medication
          administration.
      Mapped onto this study's categories: tenancy (Master Data, Collections),
      listings/search (ILS & Guest Card), payments (Receivables, Payables),
      valuation-adjacent pricing (Revenue), documents/records (Construction, Commercial
      rent roll), plus a health-records seam unique to senior living. Notably there is
      no title, escrow, conveyancing or land-registry surface — those belong to
      Teranet and the provinces in Canada, not to Yardi.

      Yardi Canada's own product line, per its 25-year retrospective, is Voyager
      (residential, commercial, senior living, investment management, affordable
      housing), Breeze Premier, Home IQ, Matrix and Pulse. The Saskatoon office —
      Yardi's Canadian development centre, acquired as Point2 Technologies in 2010 —
      owns product development for Home IQ, Matrix, Pulse and machine learning/AI
      work, plus Breeze Premier customer service and cloud infrastructure management.

findings:
  summary: |
    Yardi Canada Ltd. has real, named, documented interfaces and no public API. Those
    two facts sit together and this profile records both without letting either imply
    the other.

    The first thing to record is that the assigned primary domain does not serve a
    website. yardi.ca has been registered to Yardi Systems, Inc. (430 S Fairview Ave,
    Goleta) through CIRA since 2003-07-16, expiring 2031-07-16, currently at GoDaddy
    Corporate Domains Canada with clientTransferProhibited set. It resolves — yardi.ca
    and www.yardi.ca both point at 104.156.161.80 — but nothing listens: TCP 443 and
    TCP 80 both time out on connect (curl reports "Failed to connect to yardi.ca port
    443 after 6011 ms: Timeout was reached"). It is a defensive registration. Yardi
    Canada's actual live Canadian web presence is https://www.yardibreeze.ca/ (HTTP
    200), whose footer carries the Yardi Canada Ltd. copyright, plus Canadian landing
    pages on the parent's own hosts such as
    https://info.yardi.com/asset-management-software-for-canada (HTTP 200).

    No developer portal exists on either domain. developer.yardi.ca, api.yardi.ca and
    docs.yardi.ca do not resolve; developer.yardi.com, developers.yardi.com,
    api.yardi.com and docs.yardi.com do not resolve either. That last one matters
    beyond this repo: api.yardi.com is NXDOMAIN, so any profile carrying it as a base
    URL is carrying a host that does not exist, and no baseURL is asserted here for
    that reason. Path probes on the hosts that do answer are uniformly negative —
    /developers, /api, /docs, /api-docs, /openapi.json, /swagger.json, /$metadata,
    /llms.txt and /.well-known/openid-configuration all return HTTP 404 on
    www.yardi.com, and /developers, /api, /openapi.json, /$metadata and
    /.well-known/openid-configuration all return HTTP 404 on www.yardibreeze.ca. The
    former RentCafe API landing page at https://www.rentcafe.com/api/ no longer serves
    documentation — WebFetch received HTTP 404 from the origin and curl received HTTP
    403 from Cloudflare's bot layer — so it is recorded as unavailable rather than as a
    portal. Zero specifications were harvested and the openapi/ directory was not
    created, because nothing real exists to put in it.

    What does exist is a partner programme with named interfaces and, in one case,
    named operations. The Voyager Standard Interface Partnership Program publishes a
    twelve-family functional catalogue (Collections, Commercial, Construction,
    ILS/Guest Card, Maintenance, Master Data, Payables, Receivables, Renters
    Insurance, Revenue, Screening, Senior Living EHR/eMAR) with MITS and OSCRE lineage
    but no endpoints, no WSDL and no schema. The RentCafe API Terms of Use goes
    further and lists operation names in its Schedule A — getapartmentavailability,
    getfloorplans, getunitpricingdetails, getpropertydetails, getamenities,
    getofficehours, createlead, getavailableslots, createappointment — which is the
    single most machine-adjacent public artifact Yardi serves, and it appears in a
    legal document rather than in documentation. No base URL accompanies it, so none
    is recorded.

    On the study's central question: certification and reachability are both absent
    here, for different reasons. RESO does not certify Yardi — the full RESO
    certificates directory contains no Yardi, Point2 or RentCafe entry — and Yardi is
    not the kind of participant RESO certifies, because it holds landlords' operating
    data rather than boards' listing data. Canadian RESO certification does exist, at
    ITSO, Vancouver Island REB and Victoria REB, and Canada's listing rail is CREA's
    single national DDF feeding REALTOR.ca rather than a field of MLSs. Reachability is
    absent for a purely commercial reason: a Data Exchange Agreement per interface,
    two years of corporate history, three live Voyager clients, and an annual fee.

    Status is built-stub. Identity is solid and the gate is precisely characterised,
    but there is no self-serve developer surface and no machine-readable contract to
    capture.

