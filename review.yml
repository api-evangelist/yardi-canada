actions:
  apisYmlCreated: true
  apisListed: 2
  apisListedReason: |
    Two entries, both real and both documented, both listed WITHOUT a baseURL because
    Yardi publishes none and the commonly-cited api.yardi.com host does not resolve.
    The Voyager Standard Interfaces entry is backed by Yardi's own published interface
    catalogue; the RentCafe API entry is backed by Yardi's published Terms of Use,
    which names concrete operations. Both are attributed honestly: the contracting
    party is Yardi Systems, Inc. and Yardi Canada Ltd. is the Canadian delivery entity.
    No endpoint, host, scope or specification was invented, and nothing behind the
    partner gate was described as if it were reachable.
  openapiHarvested: false
  specsCount: 0
  readmeCreated: true

enrichmentRound2:
  date: '2026-07-26'
  reviewer: API Evangelist enrichment pipeline
  correctsEarlierFinding: true
  summary: |
    Round 1 concluded that Yardi Canada has "no machine-readable contract to capture".
    That conclusion was wrong in two specific ways, and both were found by probing
    hosts round 1 never reached. Neither finding softens the access-gate story — the
    Voyager Standard Interfaces and the RentCafe API remain partner-gated with no
    published contract — but the profile now records two real public surfaces.

    FIRST: Yardi ships an official, first-party MCP server. The Yardi Virtuoso
    Connector is listed on the Anthropic connector directory at
    https://claude.com/connectors/yardi-virtuoso and served from
    https://mcp.virtuoso.ai. Yardi announced it in early access on 2025-09-10 and as
    available-now in Virtuoso Enterprise on 2026-06-16, claiming to be "the only
    property management software provider in the real estate industry with an MCP
    connector available on the Anthropic marketplace". It is declared Read & Write,
    and its published capabilities are portfolio performance, financial data and NOI
    comparison, work order management, invoice review and approval, quarterly business
    review, and budget forecasting.

    Its authorization contract is genuinely machine-readable and anonymous:
    https://mcp.virtuoso.ai/.well-known/oauth-protected-resource (RFC 9728, HTTP 200)
    and https://mcp.virtuoso.ai/.well-known/oauth-authorization-server (RFC 8414, HTTP
    200) publish an OAuth 2.1 authorization-code flow with PKCE S256, refresh tokens,
    dynamic client registration at /oauth/register, and the scopes openid, profile,
    email and offline_access. Both documents are saved verbatim in well-known/. The
    scopes are identity-only — Yardi states data access "automatically follows existing
    user permissions", so the Yardi role is the real boundary. The tool list is NOT
    recorded anywhere in this repo: anonymous POSTs to /mcp, /sse, /v1/mcp, /api/mcp,
    /mcp/v1 and / were each answered with an HTML 403 by Cloudflare, and the
    connector's own technical documentation at help.virtuoso.ai returns HTTP 401. Tool
    names circulating in third-party MCP directories were deliberately not recorded.

    SECOND: status.yardi.com is a full Atlassian Statuspage with a public,
    unauthenticated JSON API whose eight endpoints Yardi documents itself at
    https://status.yardi.com/api. All eight returned HTTP 200. The page carries 134
    components in 16 product groups, and seven of those groups expose an explicit
    Canada component — Voyager7s, Voyager8, Breeze, Elevate, Investor Portal, Resident
    Screening and Yardi EHR Interfaces. Canadian incidents and maintenance windows are
    named outright ("Issue impacting Yardi Voyager users in the Canada region",
    2026-07-17; "Maintenance - Canada Region - Thursday April 23 - 11:00pm EDT"). This
    is the only anonymous, machine-readable read on Yardi Canada's production service
    health, and an OpenAPI was derived from Yardi's own published endpoint list plus
    the verified live responses. Yardi still publishes no OpenAPI of its own.

