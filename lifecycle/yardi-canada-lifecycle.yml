summary: >-
  Yardi runs an operationally serious status page and publishes almost nothing about
  API lifecycle. status.yardi.com is a full Atlassian Statuspage with 134 components
  in 16 product groups, region-sliced so that Canada is a first-class component under
  Voyager7s, Voyager8, Breeze, Elevate, Investor Portal, Resident Screening and Yardi
  EHR Interfaces — a Yardi Canada client can watch their own region degrade in real
  time, anonymously, through a JSON API. Against that, there is no published
  versioning policy, no deprecation policy, no Sunset/Deprecation header commitment,
  and no SLA document: uptime commitments live in the client contract, and interface
  version transitions are announced by press release.
