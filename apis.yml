apis:
- aid: yardi-canada:yardi-voyager-standard-interfaces
  name: Yardi Voyager Standard Interfaces
  description: >-
    The documented family of Voyager web-service interfaces that Yardi Canada clients
    and their vendors integrate against — Collections, Commercial, Construction,
    Internet Listing Service (ILS) and Guest Card, Maintenance, Master Data, Payables,
    Receivables, Renters Insurance, Revenue, Screening, and Senior Living EHR/eMAR.
    Several are described by Yardi as MITS-based or MITS-compliant; the Commercial
    interface is described as built on the OSCRE standard. The contracting party is
    Yardi Systems, Inc.; Yardi Canada Ltd. is the Canadian delivery and support
    entity. No base URL, endpoint list, WSDL, OpenAPI or OData $metadata document is
    published anywhere public — access is granted only after acceptance into the
    Interface Partnership Program and execution of a Data Exchange Agreement for each
    interface type, and only to companies at least two years old with three or more
    active Voyager clients, against an annual per-interface fee.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groq.png
  humanURL: https://www.yardi.com/services/interfaces/standard-interface-options/
