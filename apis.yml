- aid: yardi-canada:yardi-virtuoso-connector-mcp
  name: Yardi Virtuoso Connector (MCP)
  description: >-
    Yardi's first-party Model Context Protocol server, announced in early access on 2025-09-10 and described
    as available now in Virtuoso Enterprise on 2026-06-16. Listed on the Anthropic connector directory
    as Read & Write in the Financial services category, supported across Claude web, desktop, mobile,
    Claude Code and the Claude API. Published capabilities are portfolio performance analysis across properties
    and markets, financial data including Net Operating Income comparisons, work order management and
    tracking, invoice review and approval workflows, quarterly business review support, and budget forecasting.
    Authorization is real and anonymously discoverable — RFC 9728 protected-resource metadata and RFC
    8414 authorization-server metadata on mcp.virtuoso.ai publish an OAuth 2.1 authorization-code flow
    with PKCE S256, refresh tokens and dynamic client registration, with the scopes openid, profile, email
    and offline_access. Those scopes carry identity only: Yardi states data access follows the caller's
    existing Yardi user permissions, so a Yardi Canada client's tenancy roles are the real boundary. The
    tool list is not anonymously introspectable — every unauthenticated JSON-RPC POST is answered with
    an HTML 403 by Cloudflare — and the connector's technical documentation returns HTTP 401, so no tool
    names or input schemas are asserted in this profile. Access requires a licensed, configured Virtuoso
    Enterprise tenancy; there is no trial and no developer sandbox.
  image: >-
    https://www.yardi.com/wp-content/themes/cmw-standard-v2-theme/images/icons/apple-touch-icon-152x152.png
  humanURL: https://claude.com/connectors/yardi-virtuoso
  baseURL: https://mcp.virtuoso.ai
