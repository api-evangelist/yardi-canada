aid: yardi-canada
url: https://raw.githubusercontent.com/api-evangelist/yardi-canada/refs/heads/main/apis.yml
name: Yardi Canada
kind: company
description: >-
  Yardi Canada Ltd. is the Canadian subsidiary of Yardi Systems, Inc. (Goleta,
  California), opened in Mississauga in 1998 and now headquartered in Toronto with
  regional offices in Saskatoon and Vancouver and roughly 500 staff. It sells,
  implements and supports the Yardi property and investment management stack in
  Canada — Voyager, Breeze Premier, RentCafe, Home IQ, Matrix and Pulse — across
  residential, commercial, affordable, senior living and investment portfolios, and
  its Canadian footprint grew by acquisition: Point2 Technologies in Saskatoon in
  2010, an EnerNOC division in Vancouver in 2016, and Planimetron in Toronto in 2022.
  It sits on the systems-of-record rung of the value chain rather than the listing or
  land-registration rung — it is the ledger and operating platform a landlord or
  asset manager runs on, not a portal like REALTOR.ca and not a registry operator
  like Teranet. Its API posture, stated honestly, is licensed-access-only and
  partner-gated. There is no public developer portal: developer., developers., api.
  and docs. hosts do not resolve on either yardi.ca or yardi.com, and the primary
  Canadian domain yardi.ca — registered to Yardi Systems, Inc. since 2003 — resolves
  to 104.156.161.80 but serves no web content at all (TCP 443 and 80 both time out).
  Real interfaces exist, but only behind the Interface Partnership Program: an
  application, a signed Data Exchange Agreement per interface type, a company at
  least two years old with three or more active Voyager clients, and an annual
  per-interface fee. RESO is absent entirely — Yardi appears nowhere in the RESO
  certification directory — which is the expected result for a Canadian property
  management vendor, because Canadian residential listings move through CREA's DDF
  and REALTOR.ca rather than through RESO-certified MLS endpoints. Two public,
  machine-readable surfaces do exist and neither of them is REST. Yardi ships a
  first-party MCP server — the Yardi Virtuoso Connector, listed on the Anthropic
  connector directory and served from mcp.virtuoso.ai — whose OAuth 2.1 authorization
  contract (RFC 8414 and RFC 9728 metadata, PKCE, dynamic client registration) is
  published anonymously even though its tool list is not. And status.yardi.com runs a
  full Atlassian Statuspage with a public JSON API across 134 components in 16 product
  groups, seven of which carry an explicit Canada component — the only anonymous,
  machine-readable signal of Yardi Canada's production service health.
