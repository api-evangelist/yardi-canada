- aid: yardi-canada:rentcafe-api
  name: RentCafe API
  description: >-
    The RentCafe marketing, leasing and resident-services API, used by Yardi Canada's
    multifamily clients and their vendors. Yardi's published RentCafe API Terms of Use
    names concrete operations in its Schedule A — getapartmentavailability,
    getfloorplans, getunitpricingdetails, getpropertydetails, getamenities,
    getofficehours, createlead, getavailableslots and createappointment — and states
    that use "is by way of that certain RentCafe API Access Agreement between you and
    Yardi Systems, Inc." Access is restricted to vendors serving "Common Clients"
    (entities that are clients of both Yardi and the vendor), credentials are described
    only as an access token, and the vendor may not pass Common Client Data to third
    parties. No base URL, reference documentation, OpenAPI document or self-serve
    signup is published; https://www.rentcafe.com/api/ no longer serves documentation.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groq.png
