apis:
- aid: yardi-canada:yardi-voyager-standard-interfaces
  name: Yardi Voyager Standard Interfaces
  description: >-
    The documented family of Voyager web-service interfaces that Yardi Canada clients and their vendors
    integrate against — Collections, Commercial, Construction, Internet Listing Service (ILS) and Guest
    Card, Maintenance, Master Data, Payables, Receivables, Renters Insurance, Revenue, Screening, and
    Senior Living EHR/eMAR. Several are described by Yardi as MITS-based or MITS-compliant; the Commercial
    interface is described as built on the OSCRE standard. The contracting party is Yardi Systems, Inc.;
    Yardi Canada Ltd. is the Canadian delivery and support entity. No base URL, endpoint list, WSDL, OpenAPI
    or OData $metadata document is published anywhere public — access is granted only after acceptance
    into the Interface Partnership Program and execution of a Data Exchange Agreement for each interface
    type, and only to companies at least two years old with three or more active Voyager clients, against
    an annual per-interface fee.
  imageNote: >-
    The `image` property was removed on 2026-08-26. It had been copied verbatim out of a bootstrap template
    and pointed at an icon belonging to groq, not to this company. That asset returns HTTP 200, so the
    record rendered another company's brand rather than a broken image, which is why it went unreported
    (roadmap#153). No correct icon has been sourced yet. Shipping the wrong company's mark is worse than
    shipping none; re-run the icon backfill once a real asset exists.
  humanURL: https://www.yardi.com/services/interfaces/standard-interface-options/
  tags:
  - Property Management
  - Commercial Real Estate
  - Maintenance
  - Accounting
  - Screening
  - Listings
  - MITS
  - OSCRE
  properties:
  - type: Documentation
    url: https://www.yardi.com/services/interfaces/standard-interface-options/
  - type: GettingStarted
    url: https://www.yardi.com/company/become-an-interface-partner/
  - type: Partners
    url: https://www.yardi.com/company/become-an-interface-partner/
- aid: yardi-canada:rentcafe-api
  name: RentCafe API
  description: >-
    The RentCafe marketing, leasing and resident-services API, used by Yardi Canada's multifamily clients
    and their vendors. Yardi's published RentCafe API Terms of Use names concrete operations in its Schedule
    A — getapartmentavailability, getfloorplans, getunitpricingdetails, getpropertydetails, getamenities,
    getofficehours, createlead, getavailableslots and createappointment — and states that use "is by way
    of that certain RentCafe API Access Agreement between you and Yardi Systems, Inc." Access is restricted
    to vendors serving "Common Clients" (entities that are clients of both Yardi and the vendor), credentials
    are described only as an access token, and the vendor may not pass Common Client Data to third parties.
    No base URL, reference documentation, OpenAPI document or self-serve signup is published; https://www.rentcafe.com/api/
    no longer serves documentation.
  imageNote: >-
    The `image` property was removed on 2026-08-26. It had been copied verbatim out of a bootstrap template
    and pointed at an icon belonging to groq, not to this company. That asset returns HTTP 200, so the
    record rendered another company's brand rather than a broken image, which is why it went unreported
    (roadmap#153). No correct icon has been sourced yet. Shipping the wrong company's mark is worse than
    shipping none; re-run the icon backfill once a real asset exists.
  humanURL: https://resources.yardi.com/legal/rc-api-tou/
  tags:
  - Multifamily
  - Rentals
  - Leasing
  - Residents
  - Payments
  - Marketing
