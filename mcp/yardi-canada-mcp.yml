summary: >-
  Yardi ships a real, first-party, hosted MCP server — the Yardi Virtuoso Connector —
  and it is the single most important correction to the earlier reading of this
  provider. Yardi publishes no OpenAPI, no developer portal and no self-serve REST
  surface, yet it has an agent-facing contract listed on the Anthropic connector
  directory and an anonymous, machine-readable OAuth discovery surface on
  mcp.virtuoso.ai. For Yardi the agent interface, not the web API, is the public
  integration story. Yardi's own claim in the June 2026 release is that it is "the
  only property management software provider in the real estate industry with an MCP
  connector available on the Anthropic marketplace." Yardi Canada Ltd. clients reach
  it through the same Virtuoso Enterprise platform; access follows existing Yardi
  user permissions, so a Canadian tenancy's data stays inside that tenancy's controls.
