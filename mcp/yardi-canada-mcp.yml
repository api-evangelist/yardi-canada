  permission_model: >-
    "The Virtuoso Connector authenticates through Yardi, so data access automatically
    follows existing user permissions" (Yardi press release, 2026-06-16). The OAuth
    scopes above are identity scopes only — the actual data authorization is the
    caller's Yardi role, not an MCP scope.
