    The RentCafe API Terms of Use Schedule A names nine operations —
    getapartmentavailability, getfloorplans, getunitpricingdetails, getpropertydetails,
    getamenities, getofficehours, createlead, getavailableslots, createappointment.
    They are recorded here as evidence of a real surface, not as bindable operationIds:
    no path, base URL, parameter or schema is published for any of them.
