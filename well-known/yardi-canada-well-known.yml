generated: '2026-07-26'
method: searched
source: live probes of every Yardi/Yardi Canada host on 2026-07-26
summary: >-
  Two real discovery documents exist across the whole Yardi estate, and both sit on
  the Yardi Virtuoso MCP host rather than on any Yardi web property. mcp.virtuoso.ai
  serves RFC 9728 protected-resource metadata and RFC 8414 authorization-server
  metadata anonymously — that is the machine-readable authorization contract behind
  the Yardi Virtuoso Connector for Claude. Every /.well-known/ path on www.yardi.com,
  www.yardibreeze.ca, resources.yardi.com and virtuoso.ai returns 404 or an HTML
  application shell. Recording the misses is deliberate: it is the evidence that the
  agent-facing surface, not the web surface, is where Yardi publishes discovery.
hosts:
  - host: https://mcp.virtuoso.ai
    role: Yardi Virtuoso MCP server (official Claude connector)
    documents:
      - path: /.well-known/oauth-protected-resource
        spec: RFC 9728
        status: 200
        file: yardi-canada-oauth-protected-resource.json
      - path: /.well-known/oauth-authorization-server
        spec: RFC 8414
        status: 200
        file: yardi-canada-oauth-authorization-server.json
      - path: /.well-known/openid-configuration
        status: 403
        note: Cloudflare bot layer returned 403 to the automated client; not confirmed absent.
      - path: /.well-known/security.txt
        status: 403
        note: Cloudflare bot layer returned 403 to the automated client; not confirmed absent.
      - path: /.well-known/api-catalog
        status: 403
      - path: /.well-known/ai-plugin.json
        status: 403
      - path: /llms.txt
        status: 403
  - host: https://www.yardi.com
